
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Campus<span>Find</span></div>

        <nav>
            <a href="#home">Home</a>
            <a href="#items">Browse Items</a>
            <a href="#report">Report Item</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Lost something on campus?</h1>
        <p>Find your belongings or help someone reunite with theirs.</p>

        <div class="hero-buttons">
            <a href="#items" class="btn">Browse Items</a>
            <a href="#report" class="btn secondary">Report an Item</a>
        </div>
    </section>

    <section class="stats">
        <div class="stat-box">
            <h2 id="totalItems">0</h2>
            <p>Total Listings</p>
        </div>

        <div class="stat-box">
            <h2 id="lostCount">0</h2>
            <p>Lost Items</p>
        </div>

        <div class="stat-box">
            <h2 id="foundCount">0</h2>
            <p>Found Items</p>
        </div>
    </section>

    <section class="items-section" id="items">

        <h2>Browse Items</h2>

        <div class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for an item..."
            >

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Books">Books</option>
                <option value="ID Cards">ID Cards</option>
                <option value="Other">Other</option>
            </select>

            <select id="typeFilter">
                <option value="All">Lost & Found</option>
                <option value="Lost">Lost</option>
                <option value="Found">Found</option>
            </select>
        </div>

        <div class="items-grid" id="itemsGrid">
        </div>

    </section>

    <section class="report-section" id="report">

        <h2>Report an Item</h2>

        <form id="itemForm">

            <input
                type="text"
                id="itemName"
                placeholder="Item name"
                required
            >

            <select id="itemCategory" required>
                <option value="">Select Category</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Books">Books</option>
                <option value="ID Cards">ID Cards</option>
                <option value="Other">Other</option>
            </select>

            <select id="itemType" required>
                <option value="">Select Status</option>
                <option value="Lost">Lost</option>
                <option value="Found">Found</option>
            </select>

            <input
                type="text"
                id="itemLocation"
                placeholder="Location (e.g. Library)"
                required
            >

            <input
                type="date"
                id="itemDate"
                required
            >

            <input
                type="url"
                id="itemImage"
                placeholder="Image URL (optional)"
            >

            <textarea
                id="itemDescription"
                placeholder="Describe the item..."
                required
            ></textarea>

            <input
                type="text"
                id="contactInfo"
                placeholder="Contact information (optional)"
            >

            <button type="submit" class="btn">Submit Report</button>

        </form>

    </section>

    <footer>
        <p>CampusFind | Helping belongings find their owners.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
